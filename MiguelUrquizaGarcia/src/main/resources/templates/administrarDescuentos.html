<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

</head>

<body class="d-flex flex-column min-vh-100">



	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/prendas}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/ventas}">Ventas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link " th:href="@{/quienesSomos}">Quienes Somos</a>
						</li>
					</ul>
					<a href="inicioSesion.html"><i class=" h2 bi bi-person-fill text-white"></i></a>
				</div>
			</div>
		</nav>
		<span class="h2 container-content d-block text-center bg-primary text-white py-3 fw-semibold">Gestionar
					Descuentos</span>
	</header>
	<main class="flex-fill px-0 container-fluid text-primary">

		<div class="card shadow">
			
			<div class="card-body table-responsive">
				<table class="table table-hover align-middle text-center">
					<thead class="table-light">
						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th>Descripción</th>
							<th>Precio Servicio (€)</th>
							<th>Top Venta</th>
							<th>Descuento (%)</th>
							<th>Nº Prendas Descuento</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="cat : ${categorias}">
							<td th:text="${cat.id}"></td>
							<td th:text="${cat.nombre}"></td>
							<td th:text="${cat.descripcion}"></td>
							<td th:text="${cat.precioServicio}"></td>
							<td>
								<span class="badge" th:classappend="${cat.topVenta} ? 'bg-success' : 'bg-secondary'"
									th:text="${cat.topVenta ? 'Sí' : 'No'}"></span>
							</td>
							<form action="#" method="post" th:action="@{/editarDescuentos/submit/{id}(id=${cat.id})}">
								<td>
									<input type="number" step="0.01" min="0" name="descuento"
										th:value="${cat.descuento}"
										class="form-control form-control-sm border-primary shadow-sm">
								</td>
								<td>
									<input type="number" step="1" min="0" name="cantidadPrendas"
										th:value="${cat.numeroPrendasDescuento}"
										class="form-control form-control-sm border-primary shadow-sm">
								</td>
								<td>
									<button type="submit" name="guardar"
										class="btn btn-sm btn-outline-success shadow-sm">
										<i class="bi bi-save"></i> Guardar
									</button>
								</td>
							</form>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
