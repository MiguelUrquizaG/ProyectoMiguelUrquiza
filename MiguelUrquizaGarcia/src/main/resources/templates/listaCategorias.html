<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

</head>


<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/ventas}">Ventas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/quienesSomos}">Quienes Somos</a>
						</li>
					</ul>
					<a href="inicioSesion.html"><i class=" h2 bi bi-person-fill text-white"></i></a>
				</div>
			</div>
		</nav>

	</header>

	<main class="flex-fill container my-4">
		<div class="container mt-3">
			<div class="row">
				<button type="button" class="btn btn-primary col-2 mx-2 w-sm-auto w-25" data-bs-toggle="modal"
					data-bs-target="#anadirCategoria">Añadir Categoria</button>

			</div>
		</div>



		<div class="row my-3 w-75 ms-0">
			<form method="get" th:action="@{/buscarCategoria}" class="d-flex flex-column col-3">
				<label class="col-form-label">Buscar Por Nombre</label>
				<input type="text" name="query" class="form-control ">
				<button type="submit"  class="btn btn-dark text-white mt-2 fw-semibold shadow rounded">Buscar</button>
			</form>

			<form method="get" th:action="@{/filtrarPrecioMax}" class="d-flex flex-column col-6">
			   <label class="col-form-label fw-semibold">Filtrar categorías sin Top Venta y precio menor a:</label>
			   <input type="number" step="0.01" min="0" name="precioMax" class="form-control" placeholder="Precio máximo" required />
			   <button type="submit" class="btn btn-dark text-white mt-2 fw-semibold shadow rounded">
			     Filtrar
			   </button>
			 </form>
			 <form method="get" th:action="@{/categorias}" class="col-2 d-flex align-items-end">
			     <button type="submit" class="btn btn-outline-secondary w-100">Resetear filtros</button>
			 </form>
		</div>

		<div th:if="${#lists.isEmpty(categoria)}" class="mt-3">
			<p class="text-center text-dark display-6">
				No hay categorias cargadas.
			</p>

		</div>
		<div class="container">


			<div class="row mt-3">
				<div class="col-12  col-xl-6 card text-white bg-primary mb-3 mx-3 mt-3" style="width: 24rem;"
					th:each="categoria : ${categoria}">
					<div th:if="${categoria.topVenta}" class="badge bg-warning text-dark mt-3 w-25">
						Top Venta
					</div>
					<div class="card-body">

						<a class="card-title text-center mt-3 h3" role="button"
							th:href="@{/mostrarCategoria/{id} (id=${categoria.id})}" href="#"
							th:data-id="${categoria.id}" th:text="${categoria.nombre}"></a>
						<p class="card-text" th:text="${categoria.descripcion}"></p>
						<p class="card-text" th:text="'Precio Servicio: '+ ${categoria.precioServicio}+ €"></p>
						<div class="container">
							<div class="row">
								<a class=" col-5 me-1  btn btn-light" th:data-id="${categoria.id}"
									th:href="@{/editarCategoria/{id} (id=${categoria.id})}" href="#offcanvasPantalon"
									role="button" th:if="${categoria.id != 0}">Modificar</a>
								<a class=" col-5 me-1 btn btn-primary" data-bs-toggle="modal"
									data-bs-target="#modalEliminar"
									th:attr="data-bs-target='#modalEliminar-' + ${categoria.id}"
									th:data-id="${categoria.id}" role="button" th:if="${categoria.id != 0}">Eliminar</a>
							</div>
						</div>
					</div>

					<div class="modal fade" id="modalEliminar" th:attr="id='modalEliminar-' + ${categoria.id}"
						tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
						<div class="modal-dialog">
							<div class="modal-content">
								<div class="modal-header">
									<h1 class="modal-title fs-5" id="exampleModalLabel">Eliminar</h1>
									<button type="button" class="btn-close" data-bs-dismiss="modal"
										aria-label="Cerrar"></button>
								</div>
								<div class="modal-body">
									<!-- th:action="@{/eliminarPrenda/{id} (id=${prenda.id})} -->
									¿Estás seguro que quieres eliminar?
									<form th:method="post" action="#" th:action="@{/eliminarCategoria/submit}">
										<input type="hidden" name="id" th:value="${categoria.id}" />
										<input type="hidden" name="_method" value="delete">
										<div class="modal-footer">
											<button type="submit" class="btn btn-primary">Eliminar</button>
											<button type="button" class="btn btn-secondary"
												data-bs-dismiss="modal">Cerrar</button>

										</div>

									</form>
								</div>

							</div>
						</div>
					</div>
				</div>
			</div>
		</div>


		</div>
		<div class="modal fade" id="anadirCategoria" tabindex="-1" aria-labelledby="exampleModalLabel"
			aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="exampleModalLabel">Añadir Prenda</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form method="POST" action="#" th:action="@{/anadirCategoria/submit}"
							th:object="${nuevacategoria}">
							<div class="mb-3">
								<label for="recipient-name" class="col-form-label">Nombre Categoria</label>
								<input th:field="*{nombre}" type="text" class="form-control" id="recipient-name"
									maxlength="20" pattern="[A-Za-z_ ]*">
							</div>
							<div class="mb-3 ">
								<label for="inputPrecio" class="form-label">Precio<span
										class="text-danger">*</span></label>
								<input type="number" th:field="*{precioServicio}" class="form-control" id="inputPrecio"
									required></input>
							</div>
							<div class="mb-3 ">
								<label for="inputDescripcion" class="form-label">Descripción<span
										class="text-danger">*</span></label>
								<textarea th:field="*{descripcion}" class="form-control" id="inputDescripcion"
									required></textarea>
							</div>
							<div class="mb-3  form-check">
								<label for="inputCheck" class="form-check-label">Top Venta<span
										class="text-danger">*</span></label>
								<input th:field="*{topVenta}" type="checkbox" class="form-check-input" id="inputCheck">
							</div>

							<div class="mb-3">
								<label for="inputDescuento" class="form-label">Descuento<span
										class="text-danger">*</span></label>
								<input id="inputDescuento" required class="form-control" th:field="*{descuento}">
							</div>

							<button type="submit" class="btn btn-primary">Crear Categoría</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>


						</form>
					</div>
				</div>
			</div>
		</div>

	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
