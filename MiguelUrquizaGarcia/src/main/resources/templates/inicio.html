<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<meta name="description" content="Página Inicio">
	<title>Tintoreria Urquiza</title>

</head>

<body class="d-flex flex-column min-vh-100">


	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">

						<li class="nav-item">
							<a class="nav-link active" th:href="@{/}">Inicio
							</a>
						</li>

						<li class="nav-item">
							<a class="nav-link " th:href="@{/prendas}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link " th:href="@{/ventas}">Ventas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link " th:href="@{/quienesSomos}">Quienes Somos</a>
						</li>
					</ul>

				</div>
			</div>
		</nav>

	</header>


	<main class="flex-fill">
		<section
			class="vh-100 position-relative text-white text-center d-flex align-items-center justify-content-center overflow-hidden">


			<div class="position-absolute top-0 start-0 w-100 h-100">
				<img th:src="@{/img/tintorero.png}" class="w-100 h-100 object-fit-cover" alt="Fondo" />
				<div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>
			</div>


			<div class="container position-relative z-1">
				<h1 class="display-4 fw-bold text-white">Tu ropa en las mejores manos</h1>
				<p class="lead">Lavado, planchado y servicio de calidad</p>
				<a th:href="@{/prendas}" class="btn btn-light btn-lg mt-3">Ver Prendas</a>
			</div>

		</section>
	</main>



	<div th:replace="~{fragments/footer :: footer}"></div>



</body>

</html>
