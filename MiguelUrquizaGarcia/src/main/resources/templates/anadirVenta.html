<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/ventas}">Ventas
							</a>
						</li>
					</ul>
					<a href="inicioSesion.html"><i class=" h2 bi bi-person-fill text-white"></i></a>
				</div>
			</div>
		</nav>

	</header>
	<main class="flex-fill container my-4">

		<div class="container">







			<form method="POST" action="#" th:action="@{/anadirVenta/submit}" th:object="${nuevaVenta}" class="w-100"
				name="inicioSesion">
				<div class="row justify-content-center mt-3 mb-5">
					<div class="col-3  col-lg-3 ">
						<label for="inputNombre" class="form-label">Nombre Prenda<span
								class="text-danger">*</span></label>
						<input th:field="*{nombreCliente}" type="text" class="form-control" id="inputNombre" required
							placeholder="Introduzca el nombre." maxlength="9" pattern="[A-Za-z_ ]*">
					</div>
					<div class="col-3 ">
						<label for="inputFechaEntrega" class="form-label">Fecha Entrega<span
								class="text-danger">*</span></label>
						<input th:field="*{fechaEntrega}" type="date" min="1" class="form-control"
							id="inputFechaEntrega" required placeholder="Ingrese el precio del producto.">
					</div>
					<div class="col-3 ">
						<label for="inputFechaRecogida" class="form-label">Fecha Recogida<span
								class="text-danger">*</span></label>
						<input th:field="*{fechaRecogida}" type="date" min="1" class="form-control"
							id="inputFechaRecogida" required placeholder="Ingrese el precio del producto.">
					</div>
				</div>


				<div id="lineasVenta">

				</div>

				<div>
					<button type="submit" class="btn btn-dark">Guardar Venta</button>
				</div>
			</form>
			<button class="btn btn-primary" id="btnAnadirLinea">Añadir Linea</button>

		</div>

	</main>

	<footer class=" text-center bg-primary text-lg-start text-white mt-0">

		<div>
			<div class="container text-center text-md-start">
				<div class="row">
					<div class="col-md-3 col-lg-4 col-xl-3 mx-auto  mt-4">
						<p class="h5 text-uppercase fw-bold  text-white">
							Tintoreria Urquiza
						</p>
						<p>
							Nuestra Tintorería cuidará tu ropa de una forma única.
						</p>
					</div>
					<div class="col-md-3 col-lg-2 col-xl-2 mx-auto  mt-4">
						<p class="h5 text-uppercase fw-bold text-white">
							Contáctanos
						</p>
						<p class="h6 text-white"><i class="bi bi-house"></i> C/San Vicente de Paúl 13</p>
						<p class="h6 text-white"><i class="bi bi-telephone"></i> +34 954 04 79 25</p>

					</div>

					<div class="col-md-3 col-lg-2 col-xl-2 mx-auto  mt-4">
						<p class="h5 text-uppercase fw-bold text-white">
							Avisos Legales
						</p>
						<a class="h6 text-white text-decoration-none" href="">Aviso legal</a>
						<a class="h6 text-white text-decoration-none" href="">Políticas</a>
					</div>
				</div>
			</div>
		</div>
		<div class="d-flex justify-content-center justify-content-between">
			<div>
				<span>Nuestras Redes</span>
			</div>
			<div>
				<a href="" class=" h5 me-4 text-reset text-decoration-none">
					<i class="bi bi-facebook"></i>
				</a>
				<a href="" class="me-4 text-reset text-decoration-none">
					<i class="bi bi-twitter-x"></i>
				</a>
				<a href="" class="me-4 text-reset text-decoration-none">
					<i class="bi bi-google"></i>
				</a>
				<a href="" class="me-4 text-reset text-decoration-none">
					<i class="bi bi-instagram"></i>
				</a>
			</div>
		</div>
	</footer>

</body>

<script th:inline="javascript">

	let categorias = [[${categoria}]];
	let prendas = [[${prenda}]];
	console.log("Categorías cargadas:", categorias);
	console.log("Prendas:", prendas)

	document.addEventListener('DOMContentLoaded', function () {
		console.log("DOM completamente cargado, evento añadido");
		document.getElementById('btnAnadirLinea').addEventListener('click', function () {
			console.log("Boton Pulsado")
			generarLineasVenta();
		});
	})

	function generarLineasVenta() {
		console.log("Generando línea de venta...");
		const container = document.getElementById('lineasVenta')
		const fila = document.createElement('div');
		fila.classList.add('row', 'mb-3')

		let selectCategoria = document.createElement('select');
		selectCategoria.classList.add('form-select');
		selectCategoria.name = "categoria";

		let defaultOption = document.createElement('option');
		defaultOption.text = 'Seleccione Categoria'
		defaultOption.value = "";
		selectCategoria.appendChild(defaultOption);

		let selectPrenda = document.createElement('select');
		selectPrenda.classList.add('form-select');
		selectPrenda.name = "prenda"

		let defaultPrenda = document.createElement('option')
		defaultPrenda.text = 'Seleccione Prenda'
		defaultPrenda.value = ""
		selectPrenda.appendChild(defaultPrenda);

		let inputNumero = document.createElement('input')
		inputNumero.classList.add('form-control')
		inputNumero.type = 'number';
		inputNumero.min = '1';
		inputNumero.name = "cantidad";



		categorias.forEach(function (cat) {
			let option = document.createElement('option')
			option.value = cat.id;
			option.text = cat.nombre;
			selectCategoria.appendChild(option);
		})


		let precio = document.createElement('input')
		precio.classList.add('form-control')
		precio.value='0.00';
		precio.name='subtotal'
		precio.readOnly=true;
		precio.type = 'number'

		selectCategoria.addEventListener('change', function () {
			const categoriaSeleccionadaId = this.value;
			console.log(categoriaSeleccionadaId);

			selectPrenda.innerHTML = '';
			selectPrenda.appendChild(defaultPrenda);
			prendas.forEach(function (prenda) {
				console.log(prenda.categoria);
				if (prenda.categoria.id == categoriaSeleccionadaId) {

					let option = document.createElement('option');
					option.value = prenda.id;
					option.text = prenda.nombre;
					selectPrenda.appendChild(option);



				}

				});
				const categoriaSeleccionada = categorias.find(cat => cat.id == categoriaSeleccionadaId);
				if(categoriaSeleccionada){
					precio.setAttribute('data-precio-unitario',categoriaSeleccionada.precioServicio);
					actualizarSubtotal();
				}
				
				console.log("Cat seleccionada: ",categoriaSeleccionada);
				
		});
		
		inputNumero.addEventListener('input', actualizarSubtotal);
		
		function actualizarSubtotal(){
			const cantidad = parseInt(inputNumero.value)||0;
			const precioUnitario = parseFloat(precio.getAttribute('data-precio-unitario')) || 0;
			const subtotal = cantidad * precioUnitario;
			precio.value=subtotal.toFixed(2);
		}


		const colCategoria = document.createElement('div');
		colCategoria.classList.add('col-3');
		colCategoria.appendChild(selectCategoria);

		const colPrenda = document.createElement('div');
		colPrenda.classList.add('col-3');
		colPrenda.appendChild(selectPrenda);

		const colCantidad = document.createElement('div');
		colCantidad.classList.add('col-3');
		colCantidad.appendChild(inputNumero);

		const colSubtotal = document.createElement('div');
		colSubtotal.classList.add('col-3');
		colSubtotal.appendChild(precio);

		fila.appendChild(colCategoria);
		fila.appendChild(colPrenda);
		fila.appendChild(colCantidad);
		fila.appendChild(colSubtotal);
		container.appendChild(fila);
		/*console.log("Prendas recibidas:");
		prendas.forEach(p => {
			console.log(p.nombre, p.categoria.id, p.descripcion);
		});*/
	}

</script>

</html>
