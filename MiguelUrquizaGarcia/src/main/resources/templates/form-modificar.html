<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

</head>

<body class="bg-formulario text-primary d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link " th:href="@{/categorias}">Categorias
							</a>
						</li>
					</ul>
					<a href="inicioSesion.html"><i class=" h2 bi bi-person-fill text-white"></i></a>
				</div>
			</div>
		</nav>
		<span class="h2 container-content d-block text-center bg-primary text-white py-2">Modificar Prenda
		</span>
	</header>
	<main class="flex-fill container my-4">

		<div class="container">


			<div class="row justify-content-center mt-3 mb-5">
				<div class="col-12  col-lg-4">



					<form method="POST" action="#" th:action="@{/editarPrenda/modificar}" th:object="${prenda}"
						class="w-100" name="inicioSesion">
						<div class="mb-3 ">
							<input type="hidden" th:field="*{id}" />
							<label for="inputNombre" class="form-label">Nombre Prenda<span
									class="text-danger">*</span></label>
							<input th:field="*{nombre}" type="text" class="form-control" id="inputNombre" required
								placeholder="Introduzca el nombre." maxlength="9" pattern="[A-Za-z_ ]*">
						</div>

						<div class="mb-3 ">
							<label for="inputCategoria" class="form-label">Categoría<span
									class="text-danger">*</span></label>
							<select th:field="*{categoria.id}" class="form-control form-select" required>
								<option th:each="categoria : ${categoria}" th:text="${categoria.nombre}"
									th:value="${categoria.id}">

								</option>

							</select>


						</div>
						<div class="mb-3 ">
							<label for="inputDescripcion" class="form-label">Descripción<span
									class="text-danger">*</span></label>
							<textarea th:field="*{descripcion}" class="form-control" id="inputDescripcion"
								required></textarea>
						</div>
						<div class="mb-3 ">
							<label for="inputImage" class="form-label">Url Imagen<span
									class="text-danger">*</span></label>
							<input th:field="*{urlImagen}" type="text" class="form-control" id="inputImage" required>
						</div>
						<div class="mb-3  form-check">
							<label for="inputCheck" class="form-check-label">Top Venta<span
									class="text-danger">*</span></label>
							<input th:field="*{topVenta}" type="checkbox" class="form-check-input" id="inputCheck">
						</div>
						<div>
							<button type="submit" class="btn btn-dark">Editar Prenda</button>
						</div>
					</form>

				</div>
			</div>



		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
