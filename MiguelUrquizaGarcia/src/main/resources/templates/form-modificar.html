<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<meta name="description" content="Página Modifcar Prenda">
	<title>Tintoreria Urquiza - Modificar Prenda</title>

</head>


<body class="bg-formulario text-primary d-flex flex-column min-vh-100">
	<header>
		<nav class="navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/}">Inicio
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/prendas}">Prendas</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/categorias}">Categorias</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/ventas}">Ventas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/quienesSomos}">Quienes Somos</a>
						</li>
					</ul>

				</div>
			</div>
		</nav>
		<span class="h2 container-content d-block text-center bg-primary text-white py-3 fw-semibold">Modificar
			Prenda</span>
	</header>

	<main class="flex-fill container my-5">
		<div class="row justify-content-center">
			<div class="col-12 col-md-6 col-lg-4">
				<form method="POST" action="#" th:action="@{/prendas/editarPrenda/modificar}" th:object="${prenda}"
					class="bg-white rounded-3 shadow-sm p-4" name="modificarPrenda">
					<input type="hidden" th:field="*{id}" />

					<div class="mb-4">
						<label for="inputNombre" class="form-label fw-semibold">Nombre Prenda <span
								class="text-danger">*</span></label>
						<input th:field="*{nombre}" type="text" class="form-control border-primary" id="inputNombre"
							required placeholder="Introduzca el nombre" maxlength="20"
							pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ_ ]*" />
						<div class="invalid-feedback">
							Por favor, introduzca un nombre válido (solo letras y espacios).
						</div>
					</div>

					<div class="mb-4">
						<label for="inputCategoria" class="form-label fw-semibold">Categoría <span
								class="text-danger">*</span></label>
						<select th:field="*{categoria.id}" class="form-select border-secondary" id="inputCategoria"
							required>
							<option value="" disabled selected>Seleccione una categoría</option>
							<option th:each="categoria : ${categoria}" th:text="${categoria.nombre}"
								th:value="${categoria.id}"></option>
						</select>
						<div class="invalid-feedback">Seleccione una categoría válida.</div>
					</div>

					<div class="mb-4">
						<label for="inputDescripcion" class="form-label fw-semibold">Descripción <span
								class="text-danger">*</span></label>
						<textarea th:field="*{descripcion}" class="form-control border-success" id="inputDescripcion"
							rows="3" required placeholder="Describa detalles de la prenda"
							pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ_ ]*"></textarea>
						<div class="invalid-feedback">La descripción es obligatoria.</div>
					</div>

					<div class="mb-4">
						<label for="inputImage" class="form-label fw-semibold">URL Imagen</label>
						<input th:field="*{urlImagen}" type="text" class="form-control border-warning" id="inputImage"
							placeholder="https://ejemplo.com/imagen.jpg" />
						<div class="invalid-feedback">Introduzca una URL válida.</div>
					</div>

					<div class="form-check mb-4">
						<input th:field="*{topVenta}" type="checkbox"
							class="form-check-input bg-danger border-danger shadow-smr" id="inputCheck" />
						<label for="inputCheck" class="form-check-label fw-semibold text-danger">Top Venta</label>
					</div>

					<div class="d-grid">
						<button type="submit" class="btn btn-dark shadow-sm fw-semibold">
							Editar Prenda
						</button>
					</div>
				</form>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
