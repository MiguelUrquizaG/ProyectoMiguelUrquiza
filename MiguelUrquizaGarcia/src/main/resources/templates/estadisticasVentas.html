<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza - Estadísticas Ventas</title>
	<meta name="description" content="Página Estadísticas Ventas">

	<script th:inline="javascript" defer>

		document.addEventListener("DOMContentLoaded", function () {
			let eliminado = [[${eliminado}]];

			if (eliminado === true) {
				const modalExitoEl = document.getElementById('modalExito');
				if (modalExitoEl) {
					let modalExito = new bootstrap.Modal(modalExitoEl);
					modalExito.show();
				}
			} else if (eliminado === false) {
				const modalErrorEl = document.getElementById('modalError');
				if (modalErrorEl) {
					let modalError = new bootstrap.Modal(modalErrorEl);
					modalError.show();
				}
			}
		});

	</script>


</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/}">Inicio
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link " th:href="@{/prendas}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/ventas}">Ventas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link " th:href="@{/quienesSomos}">Quienes Somos</a>
						</li>
					</ul>

				</div>
			</div>
		</nav>

	</header>
	<main class="flex-fill container-fluid px-0 py-5">
		
		<div class="text-center mb-5">
			<h1 class="section-title text-primary">Panel de Control</h1>
			<p class="text-muted fs-5">Resumen de ingresos y descuentos de ventas</p>
			
		</div>

		<div class="row text-center w-100 justify-content-center">

			<div class="col-md-4 mb-4">
				<div class="card card-custom bg-white shadow-sm h-100 p-4">
					<div class="text-primary stat-icon"><i class="bi bi-cash-stack"></i></div>
					<h5 class="text-secondary">Ingresos Totales</h5>
					<p class="fs-3 fw-bold"
						th:text="${#numbers.formatDecimal(@ventaService.calcularTotalGeneradoSinDescuento(), 1, 2)} + '€'">
						€ 7.200</p>
				</div>
			</div>

			<div class="col-md-4 mb-4">
				<div class="card card-custom bg-white shadow-sm h-100 p-4">
					<div class="text-success stat-icon"><i class="bi bi-tags"></i></div>
					<h5 class="text-secondary">Ingresos con Descuento</h5>
					<p class="fs-3 fw-bold text-success"
						th:text="${#numbers.formatDecimal(@ventaService.calcularTotalGeneradoConDescuento(), 1, 2)} + '€'">
						€ 6.350</p>
				</div>
			</div>

			<div class="col-md-4 mb-4">
				<div class="card card-custom bg-white shadow-sm h-100 p-4">
					<div class="text-danger stat-icon"><i class="bi bi-arrow-down-circle"></i></div>
					<h5 class="text-secondary">Descuentos Totales</h5>
					<p class="fs-3 fw-bold text-danger"
						th:text="${#numbers.formatDecimal(@ventaService.calcularTotalDescontado(), 1, 2)} + '€'">€ 850
					</p>
				</div>
			</div>
			<a type="button" class="btn btn-outline-primary shadow-sm w-25" th:href="@{/ventas}">
									Volver a Ventas
								</a>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
