<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

	<script th:inline="javascript" defer>

		document.addEventListener("DOMContentLoaded", function () {
			let eliminado = [[${eliminado}]];

			if (eliminado === true) {
				const modalExitoEl = document.getElementById('modalExito');
				if (modalExitoEl) {
					let modalExito = new bootstrap.Modal(modalExitoEl);
					modalExito.show();
				}
			} else if (eliminado === false) {
				const modalErrorEl = document.getElementById('modalError');
				if (modalErrorEl) {
					let modalError = new bootstrap.Modal(modalErrorEl);
					modalError.show();
				}
			}
		});

	</script>


</head>

<body>




	<aside th:fragment="aside" class="col-12 col-md-3 col-lg-2 d-none d-md-block p-0">
	  <div class="card h-100 border-0 rounded-0">
	    <div class="card-header bg-primary text-white rounded-0">
	      <h5 class="mb-0">Navegación</h5>
	    </div>
	    <div class="card-body p-0">
	      <div class="accordion accordion-flush" id="accordionSidebar">
	        

	        <div class="accordion-item me-1">
	          <h2 class="accordion-header" id="headingGeneral">
	            <button class="accordion-button" type="button"
	                    data-bs-toggle="collapse"
	                    data-bs-target="#collapseGeneral"
	                    aria-expanded="true"
	                    aria-controls="collapseGeneral">
	              <i class="bi bi-house me-2"></i> General
	            </button>
	          </h2>
	          <div id="collapseGeneral"
	               class="accordion-collapse collapse"
	               aria-labelledby="headingGeneral"
	               data-bs-parent="#accordionSidebar">
	            <div class="accordion-body p-0">
	              <ul class="nav flex-column">
	                <li class="nav-item">
	                  <a class="nav-link py-2" th:href="@{/}">
	                    <i class="bi bi-house-door me-2"></i>Inicio
	                  </a>
	                </li>
	                <li class="nav-item">
	                  <a class="nav-link py-2" th:href="@{/quienesSomos}">
	                    <i class="bi bi-people me-2"></i>Quiénes Somos
	                  </a>
	                </li>
	              </ul>
	            </div>
	          </div>
	        </div>
	        
	 
	        <div class="accordion-item me-1">
	          <h2 class="accordion-header" id="headingGestion">
	            <button class="accordion-button collapsed" type="button"
	                    data-bs-toggle="collapse"
	                    data-bs-target="#collapseGestion"
	                    aria-expanded="false"
	                    aria-controls="collapseGestion">
	              <i class="bi bi-gear me-2"></i> Gestión
	            </button>
	          </h2>
	          <div id="collapseGestion"
	               class="accordion-collapse collapse"
	               aria-labelledby="headingGestion"
	               data-bs-parent="#accordionSidebar">
	            <div class="accordion-body p-0">
	              <ul class="nav flex-column">
	                <li class="nav-item">
	                  <a class="nav-link py-2" th:href="@{/prendas}">
	                    <i class="bi bi-person me-2"></i>Prendas
	                  </a>
	                </li>
	                <li class="nav-item">
	                  <a class="nav-link py-2" th:href="@{/categorias}">
	                    <i class="bi bi-tags me-2"></i>Categorías
	                  </a>
	                </li>
	                <li class="nav-item">
	                  <a class="nav-link py-2" th:href="@{/ventas}">
	                    <i class="bi bi-cash-stack me-2"></i>Ventas
	                  </a>
	                </li>
	              </ul>
	            </div>
	          </div>
	        </div>
	        
	      </div>
	    </div>
	  </div>
	</aside>
</body>

</html>
