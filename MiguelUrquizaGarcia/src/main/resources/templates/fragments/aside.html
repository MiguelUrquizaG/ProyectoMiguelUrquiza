<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

	<script th:inline="javascript" defer>

		document.addEventListener("DOMContentLoaded", function () {
			let eliminado = [[${eliminado}]];

			if (eliminado === true) {
				const modalExitoEl = document.getElementById('modalExito');
				if (modalExitoEl) {
					let modalExito = new bootstrap.Modal(modalExitoEl);
					modalExito.show();
				}
			} else if (eliminado === false) {
				const modalErrorEl = document.getElementById('modalError');
				if (modalErrorEl) {
					let modalError = new bootstrap.Modal(modalErrorEl);
					modalError.show();
				}
			}
		});

	</script>


</head>

<body>




	<aside th:fragment="aside" class="col-md-2 d-none d-md-block  p-0">
		<div class="card h-100 border-0 rounded-0">
			<div class="card-header bg-primary text-white rounded-0">
				<h5 class="mb-0">Navegación</h5>
			</div>
			<div class="card-body p-0">
				<ul class="nav flex-column">
					<li class="nav-item">
						<a class="nav-link active py-3 border-bottom" th:href="@{/}">
							<i class="bi bi-tshirt me-2"></i>Prendas
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link py-3 border-bottom" th:href="@{/categorias}">
							<i class="bi bi-tags me-2"></i>Categorias
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link py-3 border-bottom" th:href="@{/ventas}">
							<i class="bi bi-cash-stack me-2"></i>Ventas
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link py-3" th:href="@{/quienesSomos}">
							<i class="bi bi-people me-2"></i>Quienes Somos
						</a>
					</li>
				</ul>
			</div>
		</div>
	</aside>

</body>
</html>
