<body class="bg-formulario text-primary">
	<header>

					<ul class="navbar-nav me-auto">

			</div>

	<main>
		<span class="h2 container-content d-block text-center bg-primary text-white py-2">Añadir Prenda
		</span>
		<div class="container">


			<div class="row justify-content-center mt-3 mb-5">
				<div class="col-12  col-lg-4">



					<div method="DELETE" action="#" th:action="@{/eliminarPrenda/submit}" th:object="${prenda}"
						class="w-100" name="eliminarPrenda">
						<div class="mb-3 ">
							Nombre: <span th:text="*{nombre}"></span>
						</div>

						<div class="mb-3 ">
							Precio <span th:text="*{#numbers.formatDecimal(precio,2,2)}"></span>€
						</div>

						<div class="mb-3 ">
							Descripción: <span th:text="*{descripcion}"></span>
						</div>


						<div class="mb-3 ">
							<img th:src="*{urlImagen}"></img>
						</div>

						<!-- <div class="mb-3 ">
							<label for="inputCategoria" class="form-label">Categoría<span
									class="text-danger">*</span></label>

							</select>
