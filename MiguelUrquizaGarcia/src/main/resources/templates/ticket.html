<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

</head>

<body class="m-0  d-flex flex-column min-vh-100">
	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/ventas}">Ventas
							</a>
						</li>
					</ul>
					<a href="inicioSesion.html"><i class=" h2 bi bi-person-fill text-white"></i></a>
				</div>
			</div>
		</nav>

	</header>
	<main class="flex-fill container my-4">
		<div class="container my-5">
			<div class="card shadow-sm mx-auto" style="max-width: 700px;">
				<div class="card-header bg-success text-white text-center">
					<h3 class="mb-0">
						<i class="bi bi-receipt-cutoff me-2"></i> Ticket de Venta
					</h3>
				</div>
				<div class="card-body">
					<div class="mb-4">
						<p class="mb-1"><strong><i class="bi bi-person-fill me-2"></i> Cliente:</strong> <span
								th:text="${venta.nombreCliente}">Nombre Cliente</span></p>
						<p class="mb-1"><strong><i class="bi bi-calendar-event me-2"></i> Fecha Entrega:</strong> <span
								th:text="${venta.fechaEntrega}">2025-05-15</span></p>
						<p class="mb-3"><strong><i class="bi bi-calendar-check me-2"></i> Fecha Recogida:</strong> <span
								th:text="${venta.fechaRecogida}">2025-05-20</span></p>
					</div>

					<h5 class="text-success border-bottom pb-2 mb-3">Detalles</h5>
					<ul class="list-group mb-4" th:each="linea : ${venta.lineasVenta}">
						<li class="list-group-item d-flex justify-content-between align-items-center">
							<div>
								<span class="fw-semibold">Servicio:</span> <span
									th:text="${linea.categoria.nombre}">Limpieza</span><br />
								<span><span th:text="${linea.cantidad}">1</span> x <span
										th:text="${linea.prenda.nombre}">Prenda</span></span>
							</div>
							<span class="badge bg-success rounded-pill" th:text="${linea.subtotal} + ' €'">10.00
								€</span>
						</li>
					</ul>

					<div class="text-end fs-4 fw-bold text-success">
						Total: <span th:text="${venta.precioTotal} + ' €'">50.00 €</span>
					</div>

					<div class="text-center mt-4">
						<a th:href="@{/ventas}" class="btn btn-outline-success">
							<i class="bi bi-arrow-left-circle me-1"></i> Volver a Ventas
						</a>
					</div>
				</div>
			</div>
		</div>
</main>
	 <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
