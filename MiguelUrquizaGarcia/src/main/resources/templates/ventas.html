<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/prendas}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/ventas}">Ventas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link " th:href="@{/quienesSomos}">Quienes Somos</a>
						</li>
					</ul>
					<a href="inicioSesion.html"><i class=" h2 bi bi-person-fill text-white"></i></a>
				</div>
			</div>
		</nav>

	</header>
	<main class="flex-fill container-fluid px-0">

		<div class="row g-0">
			<aside th:replace="~{fragments/aside :: aside}"></aside>

			<div class="col-md-9 px-3 py-3">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h2 class="text-primary mb-0">Listado de Ventas</h2>
					<a class="btn btn-outline-primary shadow-sm" th:href="@{/anadirVenta}">
						<i class="bi bi-plus-circle me-1"></i> Añadir Venta
					</a>
				</div>

				<div th:if="${#lists.isEmpty(ventas)}" class="mt-3">
					<p class="text-center text-dark display-6">
						No hay ventas cargadas.
					</p>

				</div>

				<div class="row g-4">
					<div class="col-12 col-md-6 col-lg-4" th:each="venta : ${ventas}">
						<div class="card shadow-sm h-100 border border-primary-subtle">
							<div class="card-body d-flex flex-column">
								<h5 class="card-title text-capitalize text-primary" th:text="${venta.numeroCliente}">
								</h5>
								<div class="mt-auto d-flex justify-content-between gap-2">
									<a class="btn btn-outline-primary w-100" th:href="@{/ticket/{id}(id=${venta.id})}">
										<i class="bi bi-receipt me-1"></i> Ver Venta
									</a>
									<button class="btn btn-outline-danger w-100" data-bs-toggle="modal"
										th:attr="data-bs-target='#modalEliminar-' + ${venta.id}">
										<i class="bi bi-trash me-1"></i> Eliminar
									</button>
								</div>
							</div>
						</div>


						<div class="modal fade" th:attr="id='modalEliminar-' + ${venta.id}" tabindex="-1"
							aria-labelledby="modalEliminarLabel" aria-hidden="true">
							<div class="modal-dialog modal-dialog-centered">
								<div class="modal-content border-0 shadow">
									<div class="modal-header bg-danger text-white">
										<h5 class="modal-title" id="modalEliminarLabel">
											<i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar eliminación
										</h5>
										<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
											aria-label="Cerrar"></button>
									</div>
									<div class="modal-body">
										<p class="fs-7 text-dark mb-4">
											¿Estás seguro de que deseas eliminar esta venta?
											Esta acción no se puede deshacer.
										</p>
										<form th:method="post" th:action="@{/eliminarVenta/submit}">
											<input type="hidden" name="id" th:value="${venta.id}" />
											<input type="hidden" name="_method" value="delete">
											<div class="d-flex justify-content-end gap-2">
												<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
													<i class="bi bi-x-circle me-1"></i> Cancelar
												</button>
												<button type="submit" class="btn btn-danger">
													<i class="bi bi-trash3-fill me-1"></i> Eliminar
												</button>
											</div>
										</form>
									</div>
								</div>
							</div>
						</div>


					</div>
				</div>
			</div>
		</div>


	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
