<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<link href="../static/bootstrap.min.css" th:href="@{/bootstrap.min.css}" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/estilo.css" th:href="@{/estilosMain.css}" rel="stylesheet" type="text/css">
	<title>Tintoreria Urquiza</title>

</head>

<body class="d-flex flex-column min-vh-100">
	<header>
		<nav class=" navbar navbar-dark navbar-expand-lg nav-underline">
			<div class="container-fluid">
				<span class="navbar-brand">Tintoreria Urquiza</span>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
					aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor01">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link " th:href="@{/}">Prendas
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/categorias}">Categorias
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/ventas}">Ventas
							</a>
						</li>
					</ul>
					<a href="inicioSesion.html"><i class=" h2 bi bi-person-fill text-white"></i></a>
				</div>
			</div>
		</nav>

	</header>
	<main class="flex-fill container my-4">

		<a class="btn btn-primary" th:href="@{/anadirVenta}">Añadir Venta</a>
		<div class="container">

			<div class="card" th:each="venta : ${ventas}">
				<div class="card-body">
					<h5 class="card-title" th:text="${venta.nombreCliente}"></h5>
					<a class="btn btn-primary" th:href="@{/ticket/{id} (id=${venta.id})}" >Ver Venta</a>
					<a class="btn btn-primary" th:attr="data-bs-target='#modalEliminar-' + ${venta.id}"
						th:data-id="${venta.id}" data-bs-toggle="modal" data-bs-target="#modalEliminar" role="button">Eliminar</a>
				</div>
				<div class="modal fade" id="modalEliminar" th:attr="id='modalEliminar-' + ${venta.id}" tabindex="-1"
					aria-labelledby="exampleModalLabel" aria-hidden="true">
					<div class="modal-dialog">
						<div class="modal-content">
							<div class="modal-header">
								<h1 class="modal-title fs-5" id="exampleModalLabel">Eliminar</h1>
								<button type="button" class="btn-close" data-bs-dismiss="modal"
									aria-label="Cerrar"></button>
							</div>
							<div class="modal-body">
								<!-- th:action="@{/eliminarPrenda/{id} (id=${prenda.id})} -->
								¿Estás seguro que quieres eliminar?
								<form th:method="post" action="#" th:action="@{/eliminarVenta/submit}">
									<input type="hidden" name="id" th:value="${venta.id}" />
									<input type="hidden" name="_method" value="delete">

									<div class="modal-footer">
										<button type="submit" class="btn btn-primary">Eliminar</button>
										<button type="button" class="btn btn-secondary"
											data-bs-dismiss="modal">Cerrar</button>

									</div>
								</form>
							</div>

						</div>
					</div>
				</div>
			</div>

		</div>

	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
